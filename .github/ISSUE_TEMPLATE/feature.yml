name: 功能請求
description: 提出新功能或操作改善建議
title: "[Feature] "
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: "⚠️ 發現資安問題（漏洞、可繞過的限制、資料外洩等）請勿在這裡公開回報，請改用[私下回報資安問題](https://github.com/supaquantboys/thuglife-feedback/security/advisories/new)，詳見 [SECURITY.md](https://github.com/supaquantboys/thuglife-feedback/blob/main/SECURITY.md)。"
  - type: textarea
    id: need
    attributes:
      label: 使用情境與需求
      description: 你想解決什麼問題？
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: 希望新增或改善的功能
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: 完成條件
      description: 怎樣的結果代表功能符合你的需求？
  - type: textarea
    id: alternatives
    attributes:
      label: 替代方案或補充資訊
      description: 請勿提供任何私人資料或存取金鑰。
